*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* header */
.top{position:relative;overflow:hidden;color:var(--hf);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;background:var(--h1);border-bottom:3px solid var(--ac)}
.hw{position:relative;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hw img{width:48px;height:48px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.hw h1{font-size:15px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.1px}
.hw p{margin:3px 0 0;font-size:12px;opacity:.85}
.th{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--hf) 30%,transparent);background:rgba(255,255,255,.12);color:var(--hf);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .4s cubic-bezier(.3,1.5,.5,1),background .2s}
.th:active{transform:rotate(25deg) scale(.9)}.th svg{width:19px;height:19px}
.pal{max-height:calc(100% - 90px);overflow-y:auto;position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:min(300px,calc(100% - 24px));background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:opacity .2s,transform .3s cubic-bezier(.3,1.4,.5,1),visibility .2s}
.pal.open{opacity:1;visibility:visible;transform:none}
.pal h4{margin:6px 8px 8px;font-size:13px;color:var(--mu);font-weight:650}
.pal button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--tx);font-size:14px;font-weight:600;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left;transition:background .2s}
.pal button:hover{background:var(--acbg)}.pal button.on{background:var(--acbg);color:var(--ac)}
.pal .sw{display:flex;flex:none;border-radius:99px;overflow:hidden;border:1px solid var(--bd);width:58px;height:22px}.pal .sw i{flex:1}
.hi{position:relative;max-width:720px;margin:10px auto 0;font-size:13px;opacity:.92;animation:rise .6s .15s both}

/* layout */
main{max-width:720px;margin:0 auto;padding:0 14px}
.ctl{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:grid;gap:7px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
.ctl:empty{display:none}
#ctl2{display:grid;gap:8px;margin-bottom:2px}#ctl2:empty{display:none}

/* segmented controls (thumb slides) */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:3px;border-radius:15px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:12px;background:var(--ac);transform:translateX(calc(var(--i)*100%));transition:transform .42s cubic-bezier(.3,1.3,.5,1);box-shadow:0 3px 8px -4px var(--ac)}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--tx);font-size:13px;font-weight:650;line-height:1.1;padding:8px 0;border-radius:12px;cursor:pointer;display:grid;justify-items:center;gap:2px;transition:color .25s}
.seg button b{font-weight:700}.seg button small{font-size:10.5px;font-weight:500;color:var(--mu);transition:color .25s}
.seg button.on{color:var(--onac)}.seg button.on small{color:inherit;opacity:.85}
.seg button.today::after,.seg button.live::after{content:"";position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--live)}
.seg button.live::after{animation:pulse 1.8s infinite}
.seg.tog button{display:flex;justify-content:center;align-items:center;gap:7px;padding:9px 0}
.seg em{font-style:normal;font-size:11px;font-weight:700;background:var(--acbg);color:var(--ac);padding:1px 8px;border-radius:99px;transition:background .25s,color .25s}
.seg button.on em{background:rgba(255,255,255,.22);color:inherit}

.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;padding:11px 40px 11px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:15px;font-weight:650;box-shadow:var(--sh)}
.sel::after{content:"";position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:translateY(-70%) rotate(45deg);pointer-events:none}

.stat{display:flex;align-items:center;gap:9px;background:var(--info,var(--card));border:1px solid var(--bd);border-radius:13px;padding:8px 12px;font-size:13px;line-height:1.3;animation:rise .4s both}
.stat span{flex:1}
.stat .now{flex:none;border:0;background:var(--acbg);color:var(--ac);font-weight:700;font-size:12px;border-radius:99px;padding:5px 11px;cursor:pointer;transition:transform .2s}.stat .now:active{transform:scale(.93)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;transition:background .3s}
.dot.on{background:var(--live);animation:pulse 1.8s infinite}
.srch{position:relative;display:block}
.srch svg{position:absolute;left:13px;top:50%;width:17px;height:17px;margin-top:-8.5px;color:var(--mu);pointer-events:none}
.srch input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--bd);border-radius:13px;background:var(--card);color:var(--tx);font-size:15px;transition:border-color .2s,box-shadow .2s}
.srch input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}

/* content */
#body{padding-top:4px}
h2{font-size:13px;font-weight:700;color:var(--mu);margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
h2 small{font-size:11px;background:var(--acbg);color:var(--ac);border-radius:99px;padding:1px 8px;font-weight:700}
.grid{display:flex;flex-wrap:wrap;gap:7px}
.free{background:var(--okbg);color:var(--ok);border-radius:11px;padding:7px 13px;font-weight:700;font-size:14px;transition:transform .2s}.free:active{transform:scale(.94)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fac{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.25;font-weight:550}
.fac::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.row2{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row2 .busy{color:var(--busy);font-weight:700;flex:none}.row2 .m{color:var(--mu);font-size:12.5px;text-align:right}
.note{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:12px;margin:8px 0;font-size:13.5px}
.empty{padding:16px 14px;color:var(--mu);font-size:14px;text-align:center}
.foot{display:flex;gap:8px;color:var(--mu);font-size:12px;margin:14px 4px 0;line-height:1.4}
.foot svg{flex:none;width:15px;height:15px;margin-top:1px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);animation:rise .4s calc(var(--c,0)*70ms) cubic-bezier(.2,.8,.2,1) both}
.card.today{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd))}
.card h3{margin:0;padding:11px 14px;font-size:15px;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--acbg),transparent 85%)}
.card h3 .tdy{font-size:11px;background:var(--ac);color:var(--onac);border-radius:99px;padding:2px 9px;font-weight:700}
.card h3 .cnt{margin-left:auto;font-size:12px;color:var(--mu);font-weight:600}
.it{display:grid;grid-template-columns:52px 3px 1fr;gap:11px;padding:11px 14px;border-top:1px solid var(--bd);transition:background .3s}
.tm{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;line-height:1.35}.tm b{display:block;color:var(--tx);font-size:13.5px}
.it .bar{border-radius:3px;background:var(--bd);transition:background .3s}
.it.live{background:color-mix(in srgb,var(--live) 9%,transparent)}.it.live .bar{background:var(--live);animation:glow 1.8s infinite}
.it .s{font-weight:650;line-height:1.3}
.it .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.it .m span{font-size:12px;background:var(--acbg);color:var(--ac);padding:2px 9px;border-radius:8px;font-weight:600}
.it .m span.r{background:none;border:1px solid var(--bd);color:var(--mu)}
.rp,.nowb{font-size:10.5px;border-radius:6px;padding:1px 7px;margin-left:7px;font-weight:700;vertical-align:1px}
.rp{background:var(--warnbg);color:var(--warn)}.nowb{background:var(--live);color:var(--onlive)}

/* bottom nav */
.tabs{position:fixed;z-index:30;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:23px;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--bd);box-shadow:0 10px 26px -10px rgba(20,22,28,.4);animation:dock .6s .1s cubic-bezier(.3,1.3,.5,1) both}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:18px;background:var(--ac);transform:translateX(calc(var(--i)*100%));transition:transform .48s cubic-bezier(.3,1.35,.5,1);box-shadow:0 4px 10px -5px var(--ac)}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--tabmu,var(--mu));display:grid;justify-items:center;gap:3px;padding:8px 2px 7px;font-size:11px;font-weight:650;line-height:1.1;cursor:pointer;transition:color .25s}
.tabs button.on{color:var(--onac)}
.tabs svg{width:21px;height:21px;transition:transform .4s cubic-bezier(.3,1.7,.5,1)}.tabs button.on svg{transform:translateY(-1px) scale(1.14)}

footer{text-align:center;padding:22px 14px 8px;color:var(--mu);font-size:13px}footer b{color:var(--ac)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes dock{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes glow{50%{opacity:.45}}
#body .it,#body .fac,#body .row2,#body .note,#body .empty,#body h2{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),14)*28ms)}
#body .free{animation:pop .38s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(min(var(--i,0),20)*22ms)}
#body.noanim *{animation:none!important}
@media(min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function syncCtl(){
 const sg=(kk,v)=>{const e=document.querySelector('.seg[data-k="'+kk+'"]');if(!e)return;e.style.setProperty('--i',v);e.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v))};
 if(tab<2){sg('d',day);sg('s',slot);sg('v',fv);
  document.querySelectorAll('.seg[data-k="d"] button').forEach(b=>b.classList.toggle('today',+b.dataset.v===today));
  document.querySelectorAll('.seg[data-k="s"] button').forEach(b=>b.classList.toggle('live',day===today&&+b.dataset.v===live));
 }else{sg('w',wd);document.querySelectorAll('.seg[data-k="w"] button').forEach(b=>b.classList.toggle('today',+b.dataset.v===today))}
}

/* views */
const empty=m=>'<div class="empty"'+sx()+'>'+m+'</div>';
function week(rows,mode){
 const ds=wd<5?[wd]:[0,1,2,3,4];let h='';
 ds.forEach((d,ci)=>{
  const r=rows.filter(e=>e[0]===d).sort((a,b)=>a[1]-b[1]);const m=[];
  r.forEach(e=>{const kk=[e[2],e[3],e[4],e[5]].join();const p=m[m.length-1];
   if(p&&p.k===kk&&p.e===e[1]-1)p.e=e[1];else m.push({k:kk,s:e[1],e:e[1],x:e})});
  h+='<div class="card'+(d===today?' today':'')+'" style="--c:'+ci+'"><h3>'+DAYS[d]+(d===today?'<span class="tdy">Today</span>':'')+'<span class="cnt">'+(m.length?m.length+(m.length===1?' class':' classes'):'')+'</span></h3>';
  if(!m.length)h+='<div class="empty">Nothing scheduled, a clear day.</div>';
  m.forEach(o=>{const e=o.x,isL=d===today&&live>=o.s&&live<=o.e;
   const who=mode==='b'?(e[4]>=0?D.t[e[4]]:''):D.b[e[2]],rm=e[3]>=0?D.r[e[3]]:'';
   h+='<div class="it'+(isL?' live':'')+'"'+sx()+'><div class="tm"><b>'+TM[o.s][0]+'</b>'+TM[o.e][1]+'</div><i class="bar"></i><div><div class="s">'+esc(D.s[e[5]])+(e[6]?'<span class="rp">Repeater</span>':'')+(isL?'<span class="nowb">Now</span>':'')+'</div><div class="m">'+(who?'<span>'+esc(who)+'</span>':'')+(rm?'<span class="r">'+esc(rm)+'</span>':'')+'</div></div></div>'});
  h+='</div>'});
 return h}
function free(){
 const now=D.e.filter(e=>e[0]===day&&e[1]===slot),bR={},bT={};
 now.forEach(e=>{const b=D.b[e[2]];
  if(e[3]>=0)(bR[e[3]]=bR[e[3]]||[]).push(b+(e[4]>=0?' · '+D.t[e[4]]:''));
  if(e[4]>=0)(bT[e[4]]=bT[e[4]]||[]).push(b+(e[3]>=0?' · '+D.r[e[3]]:''))});
 const isNow=day===today&&slot===cur,wkend=today<0&&day===0&&slot===0,when=DAYS[day]+', Lecture '+(slot+1)+' ('+TM[slot][0]+'–'+TM[slot][1]+')';
 $('stat').innerHTML='<i class="dot'+(isNow&&live===slot?' on':'')+'"></i><span>'+(isNow?'Showing right now: ':wkend?'It\u2019s the weekend, so here\u2019s ':'Showing: ')+when+'</span>'+(isNow||wkend?'':'<button type="button" class="now" data-now="1">Back to now</button>');
 const qq=q.trim().toLowerCase();let h='';
 if(day===2&&slot===1)h+='<div class="note"'+sx()+'>Wednesday 10:00–11:30 is the AS slot, so no regular classes are scheduled and everything shows as free.</div>';
 if(tab===0){
  const all=D.r.map((r,i)=>[r,i]).filter(x=>x[0].toLowerCase().includes(qq)),f=all.filter(x=>!bR[x[1]]),b=all.filter(x=>bR[x[1]]);
  $('cf').textContent=f.length;$('cb').textContent=b.length;
  if(fv===0){
   if(!f.length)h+=empty(qq?'No free room matches \u201c'+esc(q.trim())+'\u201d.':'Every room is in use at this time.');
   ['Lecture halls','Classrooms','Lecture theatres','Labs'].forEach(g=>{const l=f.filter(x=>grp(x[0])===g).map(x=>x[0]);
    if(l.length)h+='<h2'+sx()+'>'+g+'<small>'+l.length+'</small></h2><div class="grid">'+l.map(r=>'<span class="free"'+sx()+'>'+esc(r)+'</span>').join('')+'</div>'});
  }else{
   if(!b.length)h+=empty(qq?'No busy room matches \u201c'+esc(q.trim())+'\u201d.':'No room is in use at this time.');
   h+=b.map(x=>'<div class="row2"'+sx()+'><span class="busy">'+esc(x[0])+'</span><span class="m">'+esc(bR[x[1]].join(' | '))+'</span></div>').join('');
  }
 }else{
  const all=D.t.map((t,i)=>[t,i]).filter(x=>x[0].toLowerCase().includes(qq)),f=all.filter(x=>!bT[x[1]]),b=all.filter(x=>bT[x[1]]);
  $('cf').textContent=f.length;$('cb').textContent=b.length;
  if(fv===0){
   if(!f.length)h+=empty(qq?'No free faculty member matches \u201c'+esc(q.trim())+'\u201d.':'Everyone is teaching at this time.');
   h+='<div class="grid2">'+f.map(x=>'<span class="fac"'+sx()+'>'+esc(x[0])+'</span>').join('')+'</div>';
  }else{
   if(!b.length)h+=empty(qq?'No busy faculty member matches \u201c'+esc(q.trim())+'\u201d.':'Nobody is teaching at this time.');
   h+=b.map(x=>'<div class="row2"'+sx()+'><span class="busy">'+esc(x[0])+'</span><span class="m">'+esc(bT[x[1]].join(' | '))+'</span></div>').join('');
  }
 }
 return h+'<p class="foot">'+INFO+'<span>Only rooms and teachers that appear in the timetable are listed. Extra or make-up classes are not included, so please confirm before you go.</span></p>'}
const batch=()=>week(D.e.filter(e=>e[2]===bsel),'b');
const teacher=()=>week(D.e.filter(e=>e[4]===tsel),'t');
function renderBody(an){ix=0;const b=$('body');b.classList.toggle('noanim',an===false);b.innerHTML=[free,free,teacher,batch][tab]()}
function setTab(i){tab=i;q='';fv=0;[0,1,2,3].forEach(j=>{const b=$('t'+j);b.classList.toggle('on',j===i);b.setAttribute('aria-current',j===i?'page':'false')});
 $('tabs').style.setProperty('--i',i);buildCtl();syncCtl();renderBody();scrollTo({top:0,behavior:'smooth'})}

/* events */
[0,1,2,3].forEach(i=>$('t'+i).onclick=()=>setTab(i));
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.now){day=today<0?0:today;slot=cur;syncCtl();renderBody();return}
 const kk=t.dataset.k,v=+t.dataset.v;
 if(kk==='d')day=v;else if(kk==='s')slot=v;else if(kk==='w')wd=v;else if(kk==='v')fv=v;else return;
 syncCtl();renderBody()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;renderBody(false)}});
document.addEventListener('change',e=>{
 if(e.target.id==='sb'){bsel=+e.target.value;ls.set('cui_b',bsel);renderBody()}
 if(e.target.id==='st'){tsel=+e.target.value;ls.set('cui_t',tsel);renderBody()}});
setTab(0);scrollTo(0,0);
</script></body></html>
